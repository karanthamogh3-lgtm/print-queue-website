<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Owner Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<script>
  const pass = prompt("Enter owner password:");
  if (pass !== "owner123") {
    alert("Access denied");
    window.location.href = "index.html";
  }
</script>

<header class="navbar">
  <h1>
    <img src="images/printer.jpg" class="icon-lg">
    Owner Dashboard
  </h1>
</header>

<main class="container">

  <!-- PRINT ORDERS -->
  <div class="card">
    <h2>
      <img src="images/xerox.jpg" class="icon">
      Print Orders
    </h2>

    <ul id="orderList"></ul>
  </div>

  <!-- QUEUE STATUS -->
  <div class="card">
    <h2>Queue Status</h2>
    <p>Total People in Queue: <span id="people">0</span></p>
    <p>Estimated Waiting Time: <span id="time">0</span> minutes</p>
    <button onclick="clearQueue()">Clear Queue</button>
  </div>

</main>

<script>
function loadDashboard() {
  const queue = JSON.parse(localStorage.getItem("printQueue")) || [];
  const orderList = document.getElementById("orderList");

  orderList.innerHTML = "";

  queue.forEach((order, index) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <strong>${index + 1}. ${order.name}</strong><br>
      Copies: ${order.copies}<br>
      📅 Date: ${order.date}<br>
      ⏰ Time: ${order.time}
      <hr>
    `;
    orderList.appendChild(li);
  });

  document.getElementById("people").textContent = queue.length;
  document.getElementById("time").textContent = queue.length * 5;
}

function clearQueue() {
  if (confirm("Clear all orders?")) {
    localStorage.removeItem("printQueue");
    loadDashboard();
  }
}

loadDashboard();
</script>

</body>
</html>
