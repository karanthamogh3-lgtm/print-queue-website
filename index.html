<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basavanagudi Xerox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="card">

      <!-- TITLE WITH IMAGE -->
      <h1 class="title">
        <img src="images/printer.jpg" class="icon-lg" alt="Printer">
        Basavanagudi Xerox
      </h1>

      <p class="subtitle">Upload your document and join the queue</p>
<p class="phone">📞 Phone: <a href="tel:9886301923">9886301923</a></p>
<p class="address">📍 7th Main, Raghavendra Block,<br>
Basavanagudi, Bangalore - 50</p>
<div id="userInfo" style="margin-top:10px;"></div>

<p class="timing">🕘 Open: 8:00 AM – 9:00 PM</p>

      <!-- NAME -->
      <label>
        <img src="images/document.jpg" class="icon">
        Your Name
      </label>
      <input type="text" id="username" placeholder="Enter your name">

      <!-- FILE -->
      <label>
        <img src="images/document.jpg" class="icon">
        Select Document
      </label>
      <input type="file" id="file">

      <!-- COPIES -->
      <label>
        <img src="images/xerox.jpg" class="icon">
        Number of Copies
      </label>
      <input type="number" id="copies" min="1">

      <!-- BUTTON -->
      <button onclick="addToQueue()">
        <img src="images/xerox.jpg" class="icon-btn">
        Join Queue
      </button>

      <!-- RESULT -->
      <div id="result" class="result"></div>

    </div>
  </main>

  <script>
function joinQueue() {
  const name = document.getElementById("username").value;
  const copies = document.getElementById("copies").value;

  if (name === "" || copies === "") {
    alert("Please fill all details");
    return;
  }

  // Get current date & time
  const now = new Date();
  const date = now.toLocaleDateString();
  const time = now.toLocaleTimeString();

  const order = {
    name: name,
    copies: copies,
    date: date,
    time: time
  };

  let queue = JSON.parse(localStorage.getItem("printQueue")) || [];
  queue.push(order);
  localStorage.setItem("printQueue", JSON.stringify(queue));

  // Show user confirmation
  document.getElementById("userInfo").innerHTML = `
    <p>✅ Joined Queue</p>
    <p><strong>Date:</strong> ${date}</p>
    <p><strong>Time:</strong> ${time}</p>
  `;

  document.getElementById("username").value = "";
  document.getElementById("copies").value = "";
}
</script>

</body>
</html>
