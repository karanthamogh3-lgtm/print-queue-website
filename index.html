<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Queue System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📄 Print Queue Management</h1>
    <p>Upload your document and join the queue</p>

    <form id="printForm">
      <label>👤 Your Name</label>
      <input type="text" id="username" placeholder="Enter your name" required>

      <label>📂 Select Document</label>
      <input type="file" id="file" required>

      <label>🖨️ Number of Copies</label>
      <input type="number" id="copies" min="1" required>

     <button type="button" onclick="addToQueue()">Join Queue</button>

    </form>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
