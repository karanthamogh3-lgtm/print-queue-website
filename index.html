<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basavanagudi Xerox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <div class="card">

    <!-- TITLE -->
    <h1 class="title">
      <img src="images/printer.jpg" class="icon-lg" alt="Printer">
      Basavanagudi Xerox
    </h1>

    <p class="subtitle">Upload your document and join the queue</p>

    <!-- SHOP INFO -->
    <p class="phone">📞 Phone: <a href="tel:9886301923">9886301923</a></p>
    <p class="address">
      📍 7th Main, Raghavendra Block,<br>
      Basavanagudi, Bangalore – 50
    </p>
    <p class="timing">🕒 Open: 8:00 AM – 9:00 PM</p>

    <!-- USER INFO RESULT -->
    <div id="userInfo" style="margin-top:12px;"></div>

    <!-- NAME -->
    <label>
      <img src="images/document.jpg" class="icon">
      Your Name
    </label>
    <input type="text" id="username" placeholder="Enter your name">

    <!-- FILE -->
    <label>
      <img src="images/document.jpg" class="icon">
      Select Document
    </label>
    <input type="file" id="file">

    <!-- COPIES -->
    <label>
      <img src="images/xerox.jpg" class="icon">
      Number of Copies
    </label>
    <input type="number" id="copies" min="1" placeholder="Enter copies">

    <!-- BUTTON -->
    <button onclick="joinQueue()">
      <img src="images/xerox.jpg" class="icon-btn">
      Join Queue
    </button>

  </div>
</main>

<script>
function joinQueue() {
  const name = document.getElementById("username").value.trim();
  const copies = document.getElementById("copies").value;

  if (name === "" || copies === "") {
    alert("Please fill all details");
    return;
  }

  // Get current date & time
  const now = new Date();
  const date = now.toLocaleDateString();
  const time = now.toLocaleTimeString();

  const order = {
    name: name,
    copies: copies,
    date: date,
    time: time
  };

  // Get existing queue
  let queue = JSON.parse(localStorage.getItem("printQueue")) || [];
  queue.push(order);
  localStorage.setItem("printQueue", JSON.stringify(queue));

  // Show confirmation to user
  document.getElementById("userInfo").innerHTML = `
    <p>✅ <strong>Joined Queue Successfully</strong></p>
    <p><strong>Date:</strong> ${date}</p>
    <p><strong>Time:</strong> ${time}</p>
  `;

  // Clear inputs
  document.getElementById("username").value = "";
  document.getElementById("copies").value = "";
}
</script>

</body>
</html>
