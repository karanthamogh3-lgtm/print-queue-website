<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Queue System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <h1>📄 Smart Print Queue</h1>
  </header>

  <main class="container">
    <div class="card">
      <img src="images/xerox.jpg" alt="Xerox">
      <h2>Place Print Order</h2>

      <label>Number of Copies</label>
      <input type="number" id="copies" placeholder="Enter copies">

      <button onclick="addToQueue()">Add to Queue</button>

      <p id="output"></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
