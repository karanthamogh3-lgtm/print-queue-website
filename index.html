<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basavanagudi Xerox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="card">

      <!-- TITLE WITH IMAGE -->
      <h1 class="title">
        <img src="images/printer.jpg" class="icon-lg" alt="Printer">
        Basavanagudi Xerox
      </h1>

      <p class="subtitle">Upload your document and join the queue</p>
<p class="phone">📞 Phone: 9886301923</p>
      <!-- NAME -->
      <label>
        <img src="images/document.jpg" class="icon">
        Your Name
      </label>
      <input type="text" id="username" placeholder="Enter your name">

      <!-- FILE -->
      <label>
        <img src="images/document.jpg" class="icon">
        Select Document
      </label>
      <input type="file" id="file">

      <!-- COPIES -->
      <label>
        <img src="images/xerox.jpg" class="icon">
        Number of Copies
      </label>
      <input type="number" id="copies" min="1">

      <!-- BUTTON -->
      <button onclick="addToQueue()">
        <img src="images/xerox.jpg" class="icon-btn">
        Join Queue
      </button>

      <!-- RESULT -->
      <div id="result" class="result"></div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
