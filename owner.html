<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Owner Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">
    <h2>🔐 Owner Login</h2>

    <input type="password" id="ownerPass" placeholder="Enter Owner Password">
    <button onclick="checkOwner()">Login</button>

    <p id="loginMsg"></p>
  </div>
</div>

<script>
  function checkOwner() {
    const pass = document.getElementById("ownerPass").value;
    if (pass === "owner123") {
      window.location.href = "dashboard.html";
    } else {
      document.getElementById("loginMsg").innerText = "❌ Wrong password";
    }
  }
</script>

</body>
</html>
